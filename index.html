<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>POC reconnaissance photo -> lien video</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; font-family: sans-serif; }
    #contenu { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
    /* Force la camera (video) et le rendu AR (canvas) injectes par MindAR a couvrir
       tout l'ecran : evite un affichage coupe/partiel si le style par defaut de la
       librairie ne s'applique pas correctement. */
    #contenu video, #contenu canvas {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      object-fit: cover !important;
    }
    #bandeau {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.75); color: white; padding: 12px;
      font-size: 14px; z-index: 999;
      text-align: center; display: none;
    }
    #porte {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; text-align: center; padding: 24px; box-sizing: border-box;
      font-size: 18px; color: #333;
    }
  </style>
</head>
<body>
  <div id="bandeau"></div>

  <!-- Ecran affiche tant qu'aucun livre n'a ete identifie -->
  <div id="porte">
    Scannez le QR code sur la couverture du livre pour activer la reconnaissance des photos.
  </div>

  <!-- Le contenu (camera + reconnaissance) n'est injecte dans la page qu'une fois le livre identifie -->
  <div id="contenu"></div>

  <script>
    // Registre des livres connus : chaque code de couverture pointe vers SA PROPRE
    // petite banque de photos (targets.mind) et SES liens. Ca evite de charger une
    // banque commune a tous les livres (plus lent, et risque de confusion entre
    // les photos de deux livres differents).
    const LIVRES = {
      "LIVRE-A7K9": {
        mind: "livres/LIVRE-A7K9/targets.mind",
        liens: {
          0: "https://www.youtube.com/shorts/KhdILRsjpgM",    // photo du denti (seul, argente)
          1: "https://www.youtube.com/watch?v=U-XnMmOxTzc",   // photo du merou
          2: "https://www.youtube.com/shorts/xB7hY4mDLVc",    // photo du corb (groupe)
          3: "https://www.youtube.com/shorts/iJwDgrZUs8w"     // photo du sar tambour (raye)
        },
        // DEMO AR permanente (ancree tout le long) : pour l'instant aucune cible
        // n'utilise ce mode, on garde juste le mecanisme disponible.
        videosAR: {},
        // HYBRIDE (solution 1) : courte revelation ancree sur la photo (effet AR),
        // puis bascule automatique en plein ecran stable pour le confort de lecture
        // sur la duree. "ar" et "pleinEcran" pointent vers le meme fichier : la
        // bascule reprend juste apres le point ou s'arrete la phase AR (pas de saut).
        // clipDebutAR : on saute le tout debut (le merou de profil, pas utile ici) et
        // on demarre a 3s, ou il est deja engage dans son approche vers la camera.
        // dureeAR : va jusqu'a 8,5s, sur un plan net, de face, bouche ouverte.
        // delaiZoomAvantBascule : 1s avant la bascule, le zoom (sur toute cette duree,
        // pas juste un instant) accentue l'approche, puis flash+vibration pile au
        // moment de la coupe vers le plein ecran.
        videosHybride: {
          1: {
            ar: "demo-sans-ar/merou-plein-ecran.mp4",
            pleinEcran: "demo-sans-ar/merou-plein-ecran.mp4",
            clipDebutAR: 3,
            dureeAR: 5.5,
            delaiZoomAvantBascule: 1
          }
        },
        // TEST SANS AR : meme principe de declenchement par reconnaissance, mais la
        // video s'affiche en plein ecran directement, sans phase AR avant.
        // Sert a comparer le rendu cote a cote.
        // Note : on reutilise ici une 2e vidéo du merou sur la cible du corb (index 2),
        // uniquement pour ce test de rendu, pas pour la bonne association finale.
        videosPlein: {
          2: "demo-sans-ar/merou-plein-ecran.mp4" // test de rendu, cible = photo du corb
        }
      }
      // Livre suivant : ajouter une entree ici, ex.
      // "LIVRE-B3F2": { mind: "livres/LIVRE-B3F2/targets.mind", liens: { 0: "...", ... } }
    };

    const CLE_STOCKAGE = "jp-livre-poc-code";

    const params = new URLSearchParams(window.location.search);
    const codeFourni = params.get("code");

    let codeActif = null;
    if (codeFourni && LIVRES[codeFourni]) {
      codeActif = codeFourni;
      try { localStorage.setItem(CLE_STOCKAGE, codeActif); } catch (e) {}
    } else {
      try {
        const memorise = localStorage.getItem(CLE_STOCKAGE);
        if (memorise && LIVRES[memorise]) codeActif = memorise;
      } catch (e) {}
    }

    if (codeActif) {
      demarrerReconnaissance(LIVRES[codeActif]);
    }
    // sinon : on ne touche a rien, la camera n'est jamais sollicitee,
    // l'ecran "porte" reste affiche.

    function demarrerReconnaissance(livre) {
      document.getElementById("porte").style.display = "none";

      const videosAR = livre.videosAR || {};
      const videosPlein = livre.videosPlein || {};
      const videosHybride = livre.videosHybride || {};

      // Sources ancrees en AR : videos AR classiques + phase AR des hybrides.
      const sourcesAR = {};
      Object.entries(videosAR).forEach(([index, src]) => { sourcesAR[index] = src; });
      Object.entries(videosHybride).forEach(([index, cfg]) => { sourcesAR[index] = cfg.ar; });

      // Sources plein ecran : videos "sans AR" classiques + phase finale des hybrides.
      const sourcesPlein = {};
      Object.entries(videosPlein).forEach(([index, src]) => { sourcesPlein[index] = src; });
      Object.entries(videosHybride).forEach(([index, cfg]) => { sourcesPlein[index] = cfg.pleinEcran; });

      // Un <video> par cible ancree, regroupes dans <a-assets> pour que A-Frame
      // les precharge avant de les utiliser comme texture.
      const assetsHtml = Object.entries(sourcesAR).map(([index, src]) =>
        `<video id="video-ar-${index}" src="${src}" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>`
      ).join("\n");

      // Les videos plein ecran (test sans AR + phase finale des hybrides) ne passent
      // pas par A-Frame/a-assets : ce sont de simples balises <video> fixes par-dessus
      // tout le reste, creees une seule fois ici, cachees par defaut.
      Object.entries(sourcesPlein).forEach(([index, src]) => {
        const video = document.createElement("video");
        video.id = "video-plein-" + index;
        video.src = src;
        video.playsInline = true;
        video.muted = true;
        video.style.cssText = "position:fixed;top:0;left:0;width:100vw;height:100vh;" +
          "object-fit:cover;z-index:998;display:none;background:black;";

        if (videosHybride[index]) {
          // Ne reboucle pas sur le tout debut du fichier (plan de profil du merou,
          // hors-sujet ici) : une fois la fin du fichier atteinte, on revient juste
          // apres la phase AR plutot qu'au tout debut.
          video.loop = false;
          const pointBoucle = (videosHybride[index].clipDebutAR || 0) + videosHybride[index].dureeAR;
          video.addEventListener("ended", () => {
            video.currentTime = pointBoucle;
            video.play().catch(() => {});
          });
        } else {
          video.loop = true;
        }

        document.body.appendChild(video);
      });

      // Bouton de fermeture commun a toutes les lectures plein ecran (test sans AR
      // et phase finale des hybrides) : une fois la, la video n'est plus liee au
      // suivi de la photo, il faut donc un moyen manuel de revenir au scan.
      let videoPleinActif = null;
      const boutonFermer = document.createElement("button");
      boutonFermer.textContent = "🔄 Nouveau scan";
      boutonFermer.style.cssText = "position:fixed;top:12px;right:12px;z-index:1001;" +
        "background:rgba(0,0,0,0.6);color:white;border:1px solid white;border-radius:20px;" +
        "padding:8px 14px;font-size:14px;display:none;";
      document.body.appendChild(boutonFermer);

      // Flash plein ecran (blanc, tres bref) utilise pour accentuer la bascule
      // AR -> plein ecran au moment choisi, en plus du zoom sur la video ancree.
      const flashDiv = document.createElement("div");
      flashDiv.style.cssText = "position:fixed;inset:0;background:white;opacity:0;" +
        "pointer-events:none;z-index:1002;transition:opacity 0.2s ease-out;";
      document.body.appendChild(flashDiv);

      // Etat par cible hybride : a-t-on deja declenche la phase AR (minuteurs en
      // cours) et est-on deja passe en plein ecran (donc indifferent au suivi).
      const etatsHybrides = {};
      Object.keys(videosHybride).forEach(index => {
        etatsHybrides[index] = { demarre: false, enPleinEcran: false, timer: null, timerZoom: null };
      });

      function reinitialiserEffetZoom(index) {
        const avideo = document.getElementById("avideo-" + index);
        if (avideo) {
          avideo.removeAttribute("animation__zoom");
          avideo.setAttribute("scale", "1 1 1");
        }
      }

      // Coup de zoom etale sur (quasiment) toute la fenetre avant la bascule : pas
      // un instant furtif, mais une croissance visible pendant delaiZoomAvantBascule,
      // pour bien se voir avant la coupe. Grossissement marque (x2.4) expres, pour
      // que l'effet ne passe pas inapercu.
      function declencherZoomBurst(index, cfg) {
        const avideo = document.getElementById("avideo-" + index);
        if (avideo) {
          const dureeMs = Math.max(200, (cfg.delaiZoomAvantBascule || 1) * 1000 - 100);
          avideo.setAttribute("animation__zoom",
            "property: scale; from: 1 1 1; to: 2.4 2.4 2.4; dur: " + dureeMs + "; easing: easeInQuad");
        }
      }

      function basculerVersPleinEcran(index, cfg) {
        // Flash + vibration pile au moment de la coupe (pas avant) : c'est ce qui
        // accentue la bascule elle-meme, le zoom s'est deja charge de l'approche.
        flashDiv.style.opacity = "0.85";
        setTimeout(() => { flashDiv.style.opacity = "0"; }, 60);
        if (navigator.vibrate) navigator.vibrate(60);

        const videoAR = document.getElementById("video-ar-" + index);
        if (videoAR) videoAR.pause();
        const videoPlein = document.getElementById("video-plein-" + index);
        if (videoPlein) {
          videoPlein.style.display = "block";
          // Reprend juste apres la phase AR (debut du clip + sa duree), pas de saut.
          videoPlein.currentTime = (cfg.clipDebutAR || 0) + cfg.dureeAR;
          videoPlein.play().catch(() => {});
          videoPleinActif = videoPlein;
        }
        boutonFermer.style.display = "block";
        etatsHybrides[index].enPleinEcran = true;
        document.getElementById("bandeau").innerHTML = "Lecture en cours (plein ecran)";
      }

      boutonFermer.addEventListener("click", () => {
        if (videoPleinActif) { videoPleinActif.pause(); videoPleinActif.style.display = "none"; }
        videoPleinActif = null;
        boutonFermer.style.display = "none";
        document.getElementById("bandeau").style.display = "none";
        // Reinitialise les cycles hybrides : un nouveau scan de la photo repartira
        // de zero (phase AR courte, puis bascule) plutot que de rester bloque.
        Object.keys(etatsHybrides).forEach(index => {
          const etat = etatsHybrides[index];
          etat.demarre = false;
          etat.enPleinEcran = false;
          clearTimeout(etat.timer);
          clearTimeout(etat.timerZoom);
          reinitialiserEffetZoom(index);
        });
      });

      // Pour chaque cible : si elle a une video ancree (AR classique ou phase AR
      // d'un hybride), on lui ajoute un <a-video> enfant (ancre sur la photo,
      // bouge avec elle). Sinon, cible vide comme avant (comportement "lien"
      // classique gere plus bas).
      const cibles = [0, 1, 2, 3].map(index => {
        if (sourcesAR[index]) {
          return `<a-entity mindar-image-target="targetIndex: ${index}">
                     <a-video id="avideo-${index}" src="#video-ar-${index}" width="1" height="0.5625" position="0 0 0"></a-video>
                   </a-entity>`;
        }
        return `<a-entity mindar-image-target="targetIndex: ${index}"></a-entity>`;
      }).join("\n");

      // La scene A-Frame / MindAR n'est inseree dans la page qu'ici,
      // pour ne jamais declencher la demande d'acces camera avant ce point,
      // et pour pointer vers la banque de photos propre a CE livre.
      document.getElementById("contenu").innerHTML = `
        <a-scene mindar-image="imageTargetSrc: ${livre.mind}; filterMinCF: 0.001; filterBeta: 10;"
                 color-space="sRGB"
                 renderer="colorManagement: true, physicallyCorrectLights"
                 vr-mode-ui="enabled: false"
                 device-orientation-permission-ui="enabled: false">
          <a-assets>${assetsHtml}</a-assets>
          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
          ${cibles}
        </a-scene>
      `;

      // mindar-image a besoin d'un court instant pour enregistrer son composant
      // sur les entites nouvellement inserees avant qu'on y attache les ecouteurs.
      setTimeout(() => {
        document.querySelectorAll("[mindar-image-target]").forEach((el, index) => {
          let dejaDeclenche = false; // evite de relancer la redirection a chaque micro-tremblement

          el.addEventListener("targetFound", () => {
            const bandeau = document.getElementById("bandeau");

            if (videosHybride[index]) {
              const cfg = videosHybride[index];
              const etat = etatsHybrides[index];

              if (etat.enPleinEcran) {
                // Deja bascule en plein ecran independant : on ignore un nouveau
                // "found" (peut arriver si la photo repasse brievement dans le
                // champ de la camera), la lecture plein ecran continue sans broncher.
                return;
              }

              bandeau.style.display = "block";
              bandeau.innerHTML = "Photo reconnue (cible " + index + ") : apercu AR...";
              const videoAR = document.getElementById("video-ar-" + index);
              if (videoAR) { videoAR.currentTime = cfg.clipDebutAR || 0; videoAR.play().catch(() => {}); }

              if (!etat.demarre) {
                etat.demarre = true;
                const delaiZoom = Math.max(0, (cfg.dureeAR - (cfg.delaiZoomAvantBascule || 0)) * 1000);
                etat.timerZoom = setTimeout(() => declencherZoomBurst(index, cfg), delaiZoom);
                etat.timer = setTimeout(() => basculerVersPleinEcran(index, cfg), cfg.dureeAR * 1000);
              }
              return;
            }

            if (videosAR[index]) {
              // DEMO AR : la video s'affiche ancree sur la photo, pas de redirection.
              bandeau.style.display = "block";
              bandeau.innerHTML = "Photo reconnue (cible " + index + ") : video AR en cours";
              const video = document.getElementById("video-ar-" + index);
              if (video) { video.currentTime = 0; video.play().catch(() => {}); }
              return;
            }

            if (videosPlein[index]) {
              // TEST SANS AR : la video prend tout l'ecran, sans ancrage/suivi.
              bandeau.style.display = "block";
              bandeau.innerHTML = "Photo reconnue (cible " + index + ") : video plein ecran (sans AR)";
              const video = document.getElementById("video-plein-" + index);
              if (video) {
                video.style.display = "block";
                video.currentTime = 0;
                video.play().catch(() => {});
                videoPleinActif = video;
                boutonFermer.style.display = "block";
              }
              return;
            }

            const lien = livre.liens[index];
            bandeau.style.display = "block";
            bandeau.innerHTML = "Photo reconnue (cible " + index + ") -> " +
              "<a href=\"" + lien + "\" style=\"color:#9cf;text-decoration:underline;\">ouvrir le lien</a>";

            if (!dejaDeclenche) {
              dejaDeclenche = true;
              setTimeout(() => { window.location.href = lien; }, 500);
            }
          });

          el.addEventListener("targetLost", () => {
            if (videosHybride[index]) {
              const etat = etatsHybrides[index];
              if (etat.enPleinEcran) {
                // Deja independant de la photo : la perte de suivi ne doit rien
                // interrompre, c'est tout le but de la bascule.
                return;
              }
              // Phase AR interrompue avant la bascule : on annule le cycle, il
              // repartira de zero (nouvelle revelation complete) au prochain scan.
              document.getElementById("bandeau").style.display = "none";
              clearTimeout(etat.timer);
              clearTimeout(etat.timerZoom);
              etat.demarre = false;
              reinitialiserEffetZoom(index);
              const videoAR = document.getElementById("video-ar-" + index);
              if (videoAR) videoAR.pause();
              return;
            }

            document.getElementById("bandeau").style.display = "none";
            if (videosAR[index]) {
              const video = document.getElementById("video-ar-" + index);
              if (video) video.pause();
            }
            if (videosPlein[index]) {
              const video = document.getElementById("video-plein-" + index);
              if (video) { video.pause(); video.style.display = "none"; }
              videoPleinActif = null;
              boutonFermer.style.display = "none";
            }
          });
        });
      }, 0);

      // Petit diagnostic discret (coin bas-gauche) : si l'affichage reste coupe,
      // ca donne la taille reelle de la camera vs celle de l'ecran, sans avoir
      // besoin d'acceder a la console du telephone.
      setTimeout(() => {
        const camVideo = Array.from(document.querySelectorAll("video"))
          .find(v => !v.id.startsWith("video-ar-") && !v.id.startsWith("video-plein-"));
        const debug = document.createElement("div");
        debug.style.cssText = "position:fixed;bottom:0;left:0;background:rgba(0,0,0,0.6);" +
          "color:#9f9;font-size:10px;padding:4px;z-index:1000;";
        debug.textContent = "ecran " + window.innerWidth + "x" + window.innerHeight +
          " | camera " + (camVideo ? camVideo.videoWidth + "x" + camVideo.videoHeight : "introuvable");
        document.body.appendChild(debug);
      }, 2000);
    }
  </script>
</body>
</html>
