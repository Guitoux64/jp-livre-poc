<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>POC reconnaissance photo -> lien video</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; font-family: sans-serif; }
    #contenu { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
    /* Force la camera (video) et le rendu AR (canvas) injectes par MindAR a couvrir
       tout l'ecran : evite un affichage coupe/partiel si le style par defaut de la
       librairie ne s'applique pas correctement. */
    #contenu video, #contenu canvas {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      object-fit: cover !important;
    }
    #bandeau {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.75); color: white; padding: 12px;
      font-size: 14px; z-index: 999;
      text-align: center; display: none;
    }
    #porte {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; text-align: center; padding: 24px; box-sizing: border-box;
      font-size: 18px; color: #333;
    }
  </style>
</head>
<body>
  <div id="bandeau"></div>

  <!-- Ecran affiche tant qu'aucun livre n'a ete identifie -->
  <div id="porte">
    Scannez le QR code sur la couverture du livre pour activer la reconnaissance des photos.
  </div>

  <!-- Le contenu (camera + reconnaissance) n'est injecte dans la page qu'une fois le livre identifie -->
  <div id="contenu"></div>

  <script>
    // Registre des livres connus : chaque code de couverture pointe vers SA PROPRE
    // petite banque de photos (targets.mind) et SES liens. Ca evite de charger une
    // banque commune a tous les livres (plus lent, et risque de confusion entre
    // les photos de deux livres differents).
    const LIVRES = {
      "LIVRE-A7K9": {
        mind: "livres/LIVRE-A7K9/targets.mind",
        liens: {
          0: "https://www.youtube.com/shorts/KhdILRsjpgM",    // photo du denti (seul, argente)
          1: "https://www.youtube.com/watch?v=U-XnMmOxTzc",   // photo du merou
          2: "https://www.youtube.com/shorts/xB7hY4mDLVc",    // photo du corb (groupe)
          3: "https://www.youtube.com/shorts/iJwDgrZUs8w"     // photo du sar tambour (raye)
        },
        // DEMO AR : pour ces index, au lieu de rediriger vers un lien, une video
        // s'affiche directement ancree sur la photo (realite augmentee en place).
        // Ici : vraie video du merou (plus le placeholder genere).
        videosAR: {
          1: "demo-ar/merou.mp4" // photo du merou
        },
        // TEST SANS AR : meme principe de declenchement par reconnaissance, mais la
        // video s'affiche juste en plein ecran (pas ancree/suivie sur la photo).
        // Sert a comparer le rendu "plein ecran" vs "ancre en AR" cote a cote.
        // Note : on reutilise ici une 2e vidéo du merou sur la cible du corb (index 2),
        // uniquement pour ce test de rendu, pas pour la bonne association finale.
        videosPlein: {
          2: "demo-sans-ar/merou-plein-ecran.mp4" // test de rendu, cible = photo du corb
        }
      }
      // Livre suivant : ajouter une entree ici, ex.
      // "LIVRE-B3F2": { mind: "livres/LIVRE-B3F2/targets.mind", liens: { 0: "...", ... } }
    };

    const CLE_STOCKAGE = "jp-livre-poc-code";

    const params = new URLSearchParams(window.location.search);
    const codeFourni = params.get("code");

    let codeActif = null;
    if (codeFourni && LIVRES[codeFourni]) {
      codeActif = codeFourni;
      try { localStorage.setItem(CLE_STOCKAGE, codeActif); } catch (e) {}
    } else {
      try {
        const memorise = localStorage.getItem(CLE_STOCKAGE);
        if (memorise && LIVRES[memorise]) codeActif = memorise;
      } catch (e) {}
    }

    if (codeActif) {
      demarrerReconnaissance(LIVRES[codeActif]);
    }
    // sinon : on ne touche a rien, la camera n'est jamais sollicitee,
    // l'ecran "porte" reste affiche.

    function demarrerReconnaissance(livre) {
      document.getElementById("porte").style.display = "none";

      const videosAR = livre.videosAR || {};
      const videosPlein = livre.videosPlein || {};

      // Un <video> par cible qui a une demo AR, regroupes dans <a-assets>
      // pour que A-Frame les precharge avant de les utiliser comme texture.
      const assetsHtml = Object.entries(videosAR).map(([index, src]) =>
        `<video id="video-ar-${index}" src="${src}" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>`
      ).join("\n");

      // Les videos "plein ecran sans AR" ne passent pas par A-Frame/a-assets :
      // ce sont de simples balises <video> fixes par-dessus tout le reste,
      // creees une seule fois ici, cachees par defaut.
      Object.entries(videosPlein).forEach(([index, src]) => {
        const video = document.createElement("video");
        video.id = "video-plein-" + index;
        video.src = src;
        video.loop = true;
        video.playsInline = true;
        video.muted = true;
        video.style.cssText = "position:fixed;top:0;left:0;width:100vw;height:100vh;" +
          "object-fit:cover;z-index:998;display:none;background:black;";
        document.body.appendChild(video);
      });

      // Pour chaque cible : si elle a une video AR, on lui ajoute un <a-video>
      // enfant (ancre sur la photo, bouge avec elle). Sinon, cible vide comme avant
      // (comportement "lien" classique gere plus bas).
      const cibles = [0, 1, 2, 3].map(index => {
        if (videosAR[index]) {
          return `<a-entity mindar-image-target="targetIndex: ${index}">
                     <a-video src="#video-ar-${index}" width="1" height="0.5625" position="0 0 0"></a-video>
                   </a-entity>`;
        }
        return `<a-entity mindar-image-target="targetIndex: ${index}"></a-entity>`;
      }).join("\n");

      // La scene A-Frame / MindAR n'est inseree dans la page qu'ici,
      // pour ne jamais declencher la demande d'acces camera avant ce point,
      // et pour pointer vers la banque de photos propre a CE livre.
      document.getElementById("contenu").innerHTML = `
        <a-scene mindar-image="imageTargetSrc: ${livre.mind};"
                 color-space="sRGB"
                 renderer="colorManagement: true, physicallyCorrectLights"
                 vr-mode-ui="enabled: false"
                 device-orientation-permission-ui="enabled: false">
          <a-assets>${assetsHtml}</a-assets>
          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
          ${cibles}
        </a-scene>
      `;

      // mindar-image a besoin d'un court instant pour enregistrer son composant
      // sur les entites nouvellement inserees avant qu'on y attache les ecouteurs.
      setTimeout(() => {
        document.querySelectorAll("[mindar-image-target]").forEach((el, index) => {
          let dejaDeclenche = false; // evite de relancer la redirection a chaque micro-tremblement

          el.addEventListener("targetFound", () => {
            const bandeau = document.getElementById("bandeau");

            if (videosAR[index]) {
              // DEMO AR : la video s'affiche ancree sur la photo, pas de redirection.
              bandeau.style.display = "block";
              bandeau.innerHTML = "Photo reconnue (cible " + index + ") : video AR en cours";
              const video = document.getElementById("video-ar-" + index);
              if (video) { video.currentTime = 0; video.play().catch(() => {}); }
              return;
            }

            if (videosPlein[index]) {
              // TEST SANS AR : la video prend tout l'ecran, sans ancrage/suivi.
              bandeau.style.display = "block";
              bandeau.innerHTML = "Photo reconnue (cible " + index + ") : video plein ecran (sans AR)";
              const video = document.getElementById("video-plein-" + index);
              if (video) {
                video.style.display = "block";
                video.currentTime = 0;
                video.play().catch(() => {});
              }
              return;
            }

            const lien = livre.liens[index];
            bandeau.style.display = "block";
            bandeau.innerHTML = "Photo reconnue (cible " + index + ") -> " +
              "<a href=\"" + lien + "\" style=\"color:#9cf;text-decoration:underline;\">ouvrir le lien</a>";

            if (!dejaDeclenche) {
              dejaDeclenche = true;
              setTimeout(() => { window.location.href = lien; }, 500);
            }
          });

          el.addEventListener("targetLost", () => {
            document.getElementById("bandeau").style.display = "none";
            if (videosAR[index]) {
              const video = document.getElementById("video-ar-" + index);
              if (video) video.pause();
            }
            if (videosPlein[index]) {
              const video = document.getElementById("video-plein-" + index);
              if (video) { video.pause(); video.style.display = "none"; }
            }
          });
        });
      }, 0);

      // Petit diagnostic discret (coin bas-gauche) : si l'affichage reste coupe,
      // ca donne la taille reelle de la camera vs celle de l'ecran, sans avoir
      // besoin d'acceder a la console du telephone.
      setTimeout(() => {
        const camVideo = Array.from(document.querySelectorAll("video"))
          .find(v => !v.id.startsWith("video-ar-") && !v.id.startsWith("video-plein-"));
        const debug = document.createElement("div");
        debug.style.cssText = "position:fixed;bottom:0;left:0;background:rgba(0,0,0,0.6);" +
          "color:#9f9;font-size:10px;padding:4px;z-index:1000;";
        debug.textContent = "ecran " + window.innerWidth + "x" + window.innerHeight +
          " | camera " + (camVideo ? camVideo.videoWidth + "x" + camVideo.videoHeight : "introuvable");
        document.body.appendChild(debug);
      }, 2000);
    }
  </script>
</body>
</html>
