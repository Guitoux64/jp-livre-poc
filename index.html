<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>POC reconnaissance photo -> lien video</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; }
    #bandeau {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.75); color: white; padding: 12px;
      font-family: sans-serif; font-size: 14px; z-index: 999;
      text-align: center; display: none;
    }
  </style>
</head>
<body>
  <div id="bandeau"></div>

  <!--
    targets.mind contient 3 photos compilees, dans cet ordre :
    0 = gonfleur, 1 = tuyau (vanne), 2 = velo
  -->
  <a-scene mindar-image="imageTargetSrc: ./targets.mind;"
           color-space="sRGB"
           renderer="colorManagement: true, physicallyCorrectLights"
           vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false">
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity mindar-image-target="targetIndex: 1"></a-entity>
    <a-entity mindar-image-target="targetIndex: 2"></a-entity>
  </a-scene>

  <script>
    // Association "photo reconnue" -> "lien web" (liens de demonstration pour le test)
    const liens = {
      0: "https://www.google.com/search?q=gonfleur+de+pneu",   // photo du gonfleur
      1: "https://www.google.com/search?q=tuyau+d%27arrosage",  // photo de la vanne/tuyau
      2: "https://www.google.com/search?q=v%C3%A9lo"            // photo du velo
    };

    document.querySelectorAll("[mindar-image-target]").forEach((el) => {
      const index = el.getAttribute("mindar-image-target").targetIndex;

      el.addEventListener("targetFound", () => {
        const lien = liens[index];
        const bandeau = document.getElementById("bandeau");
        bandeau.style.display = "block";
        bandeau.textContent = "Photo reconnue (cible " + index + ") -> ouverture du lien dans 1s...";
        setTimeout(() => { window.location.href = lien; }, 1000);
      });

      el.addEventListener("targetLost", () => {
        document.getElementById("bandeau").style.display = "none";
      });
    });
  </script>
</body>
</html>
