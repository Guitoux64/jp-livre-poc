<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>POC reconnaissance photo -> lien video</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #bandeau {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.75); color: white; padding: 12px;
      font-size: 14px; z-index: 999;
      text-align: center; display: none;
    }
    #porte {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; text-align: center; padding: 24px; box-sizing: border-box;
      font-size: 18px; color: #333;
    }
  </style>
</head>
<body>
  <div id="bandeau"></div>

  <!-- Ecran affiche tant que le code du livre n'a pas ete valide -->
  <div id="porte">
    Scannez le QR code sur la couverture du livre pour activer la reconnaissance des photos.
  </div>

  <!-- Le contenu (camera + reconnaissance) n'est injecte dans la page qu'une fois le code valide -->
  <div id="contenu"></div>

  <script>
    // Code propre a ce livre : doit correspondre au QR colle sur la couverture.
    // A changer facilement ici si besoin (un code different par livre produit).
    const CODE_ATTENDU = "LIVRE-A7K9";
    const CLE_STOCKAGE = "jp-livre-poc-deverrouille";

    const params = new URLSearchParams(window.location.search);
    const codeFourni = params.get("code");

    if (codeFourni === CODE_ATTENDU) {
      try { localStorage.setItem(CLE_STOCKAGE, "1"); } catch (e) {}
    }

    let deverrouille = false;
    try { deverrouille = localStorage.getItem(CLE_STOCKAGE) === "1"; } catch (e) {}
    if (codeFourni === CODE_ATTENDU) deverrouille = true;

    if (deverrouille) {
      demarrerReconnaissance();
    }
    // sinon : on ne touche a rien, la camera n'est jamais sollicitee,
    // l'ecran "porte" reste affiche.

    function demarrerReconnaissance() {
      document.getElementById("porte").style.display = "none";

      // La scene A-Frame / MindAR n'est inseree dans la page qu'ici,
      // pour ne jamais declencher la demande d'acces camera avant ce point.
      document.getElementById("contenu").innerHTML = `
        <a-scene mindar-image="imageTargetSrc: ./targets.mind;"
                 color-space="sRGB"
                 renderer="colorManagement: true, physicallyCorrectLights"
                 vr-mode-ui="enabled: false"
                 device-orientation-permission-ui="enabled: false">
          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

          <a-entity mindar-image-target="targetIndex: 0"></a-entity>
          <a-entity mindar-image-target="targetIndex: 1"></a-entity>
          <a-entity mindar-image-target="targetIndex: 2"></a-entity>
        </a-scene>
      `;

      // Association "photo reconnue" -> "lien web" (liens de demonstration pour le test)
      const liens = {
        0: "https://www.youtube.com/results?search_query=gonfleur+de+pneu",   // photo du gonfleur
        1: "https://www.youtube.com/results?search_query=tuyau+d%27arrosage", // photo de la vanne/tuyau
        2: "https://www.youtube.com/results?search_query=v%C3%A9lo"          // photo du velo
      };

      // mindar-image a besoin d'un court instant pour enregistrer son composant
      // sur les entites nouvellement inserees avant qu'on y attache les ecouteurs.
      setTimeout(() => {
        document.querySelectorAll("[mindar-image-target]").forEach((el, index) => {
          let dejaDeclenche = false; // evite de relancer la redirection a chaque micro-tremblement

          el.addEventListener("targetFound", () => {
            const lien = liens[index];
            const bandeau = document.getElementById("bandeau");
            bandeau.style.display = "block";
            bandeau.innerHTML = "Photo reconnue (cible " + index + ") -> " +
              "<a href=\"" + lien + "\" style=\"color:#9cf;text-decoration:underline;\">ouvrir le lien</a>";

            if (!dejaDeclenche) {
              dejaDeclenche = true;
              setTimeout(() => { window.location.href = lien; }, 500);
            }
          });

          el.addEventListener("targetLost", () => {
            document.getElementById("bandeau").style.display = "none";
          });
        });
      }, 0);
    }
  </script>
</body>
</html>
